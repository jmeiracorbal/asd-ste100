name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate evaluation JSON
        run: |
          python -m json.tool evals/evals.json > /dev/null
          python -m json.tool evals/trigger_set.json > /dev/null

      - name: Install Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Validate Agent Skills specification
        run: skills-ref validate "$GITHUB_WORKSPACE"

      - name: Validate skills CLI discovery
        run: |
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --list | tee /tmp/skills-list.txt
          grep -q "asd-ste100" /tmp/skills-list.txt
